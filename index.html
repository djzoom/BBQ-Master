<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoker Dynamics — your digital pitmaster</title>
<meta name="description" content="Decision-support simulator for low-and-slow BBQ. Predicts the stall, recommends when to wrap, tells you when to pull.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-text">
        <span class="brand-name">Smoker Dynamics<span class="zh">· 烟熏动力学</span></span>
        <span class="brand-sub">Your digital pitmaster · 你的数字烤肉师傅</span>
      </div>
    </div>
    <div class="header-controls">
      <button class="theme-btn" id="btn-theme" title="Toggle dark mode · 切换深色"><span id="theme-icon">🌙</span></button>
    </div>
  </div>
</header>

<main class="timeline-app">
  <section class="pit-workbench" aria-label="BBQ simulation timeline">
    <div class="workbench-toolbar">
      <div class="cook-meta">
        <select id="in-preset" aria-label="Cook preset">
          <option value="texas">Texas brisket</option>
          <option value="competition">Competition</option>
          <option value="backyard">Backyard quick</option>
          <option value="custom">Custom</option>
        </select>
        <label class="inline-input" title="Wall-clock start of cook">
          <span>Start</span>
          <input id="in-start-time" type="time" value="05:30">
        </label>
        <label class="inline-input" title="Ambient air temperature">
          <span>Air</span>
          <input id="in-ambient" type="number" min="20" max="110" step="1" value="70" inputmode="numeric">
          <em>°F</em>
        </label>
        <label class="inline-input" title="Initial pit temperature (often = ambient unless preheated)">
          <span>Pit₀</span>
          <input id="in-pit-init" type="number" min="20" max="300" step="1" value="70" inputmode="numeric">
          <em>°F</em>
        </label>
        <label class="inline-input" title="Initial meat temperature (cold-from-fridge ~40, room-temp ~65)">
          <span>Meat₀</span>
          <input id="in-meat-init" type="number" min="20" max="120" step="1" value="40" inputmode="numeric">
          <em>°F</em>
        </label>
        <label class="inline-input" title="Brisket weight">
          <span>Brisket</span>
          <input id="in-weight" type="number" min="2" max="20" step="0.5" value="12" inputmode="decimal">
          <em>lb</em>
        </label>
        <strong id="metric-clock">0:00</strong>
        <span id="metric-phase">Cursor</span>
      </div>
      <div class="transport">
        <span class="ladder" title="Periodic refuel: every A minutes add B coals from the cursor onward">
          <span class="ladder-lbl">Ladder · 加炭节奏</span>
          <span class="ladder-row">every
            <input id="in-ladder-period" type="number" min="10" max="180" step="5" value="45">
            min&nbsp;+
            <input id="in-ladder-count"  type="number" min="1"  max="12" step="1" value="4">
            coal
            <button id="btn-ladder" type="button" class="ladder-btn">Apply</button>
          </span>
        </span>
        <select id="in-horizon" aria-label="Cook horizon" title="Total cook duration">
          <option value="360">6 h</option>
          <option value="720" selected>12 h</option>
          <option value="1080">18 h</option>
          <option value="1440">24 h</option>
        </select>
        <button id="btn-reset" class="tool-btn" type="button" title="Reset to preset defaults">↺ Reset</button>
      </div>
    </div>

    <aside class="radar-panel" aria-label="Final product score">
      <div class="radar-head">
        <span>Final Score</span>
        <strong id="score-overall">--</strong>
      </div>
      <canvas id="chart-score"></canvas>
    </aside>

    <div class="timeline-stage">
      <div class="readout-strip" aria-live="polite">
        <span><b id="metric-pit">230°F</b> Pit</span>
        <span><b id="metric-meat">40°F</b> Meat</span>
        <span><b id="metric-damper">70%</b> Damper</span>
        <span><b id="metric-wrap">Bare</b> Wrap</span>
      </div>
      <div class="physics-strip" aria-live="polite" title="Live integrals — collagen conversion, water retention, stall probability, fire power">
        <span><b id="metric-collagen">0%</b> Collagen <i>胶原</i></span>
        <span><b id="metric-water">100%</b> Water <i>水分</i></span>
        <span><b id="metric-stall">0%</b> Stall&nbsp;P <i>停滞</i></span>
        <span><b id="metric-fire">0&nbsp;W</b> Q_fire <i>炭火</i></span>
      </div>
      <div class="timeline-canvas">
        <canvas id="chart-timeline"></canvas>
      </div>
      <div class="event-lanes" id="event-lanes" aria-label="Cook event timeline"></div>
    </div>

    <div class="event-dock" id="event-dock" aria-label="Add event"></div>
  </section>
</main>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>

<!-- Smoker physics + logic modules -->
<script src="js/constants.js"></script>
<script src="js/heatDiffusion.js"></script>
<script src="js/stallModel.js"></script>
<script src="js/collagenModel.js"></script>
<script src="js/smokeModel.js"></script>
<script src="js/fireModel.js"></script>
<script src="js/pitModel.js"></script>
<script src="js/restModel.js"></script>
<script src="js/safety.js?v=1"></script>
<script src="js/constraints.js"></script>
<script src="js/simulator.js"></script>
<script src="js/monteCarlo.js"></script>
<script src="js/decisions.js?v=3"></script>
<script src="js/presets.js?v=3"></script>
<script src="js/notify.js?v=1"></script>

<!-- UI controller -->
<script src="js/app.js?v=14"></script>

</body>
</html>
